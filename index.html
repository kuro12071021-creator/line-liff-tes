<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイコーナー - 學生學習空間</title>
    <!-- 引入日系文青圓體 Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Zen Maru Gothic', sans-serif !important;
            background: linear-gradient(135deg, #f3f8ff 0%, #e8f1fc 100%);
            color: #4a5568;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* 主卡片：拿掉邊框，改用柔和圓角與清爽陰影 */
        .container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 40px 25px 30px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.08);
            margin: auto;
            position: relative;
        }

        /* 標題帶點手繪裝飾 */
        h2 {
            color: #2b5c8f;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .title-doodle {
            font-size: 14px;
            color: #60a5fa;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }
        
        /* 歡迎狀態卡片：簡約手帳風 */
        .welcome-card {
            background: #f7faff;
            border-radius: 20px;
            padding: 16px;
            margin: 15px 0 25px 0;
            box-shadow: inset 0 2px 4px rgba(59, 130, 246, 0.03);
        }
        #status {
            color: #3b6e9c;
            font-size: 15px;
            margin: 0;
            font-weight: 700;
        }

        /* 功能按鈕網格 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        /* 按鈕：柔和無邊框、微立體感 */
        .menu-btn {
            background: #f8fbff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 24px 10px;
            font-size: 16px;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.08);
        }
        .menu-btn:hover {
            background: #eff6ff;
            border-color: #93c5fd;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.15);
        }
        .menu-btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        .menu-btn span {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        /* Teams 按鈕特色藍色 */
        #btn-meet {
            background: #f0f7ff;
            border-color: #bfdbfe;
            color: #1e40af;
        }

        /* 底部可愛柴犬與手繪草皮裝飾 */
        .footer-art {
            margin-top: 25px;
            opacity: 0.9;
        }
        .cute-shiba {
            font-size: 24px;
            letter-spacing: 8px;
        }

        /* 自訂美觀彈跳視窗 */
        #custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 26px;
            width: 88%;
            max-width: 330px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: #2b5c8f;
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .modal-text {
            color: #334155;
            font-size: 15px;
            white-space: pre-line;
            line-height: 1.7;
            margin-bottom: 22px;
            text-align: center;
            background: #f7faff;
            padding: 16px;
            border-radius: 18px;
        }
        .modal-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 11px 30px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .modal-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標題與手繪風小裝飾 -->
        <h2>マイコーナー</h2>
        <div class="title-doodle">☁️ 🌟 🍀</div>
        
        <!-- 歡迎狀態卡片 -->
        <div class="welcome-card">
            <p id="status">正在載入您的專屬空間...</p>
        </div>

        <!-- 2大核心功能按鈕 -->
        <div class="menu-grid">
            <a href="#" id="btn-schedule" class="menu-btn" onclick="showSchedule(event)">
                <span>📅</span>課程時間
            </a>
            <!-- 固定的 Teams 上課連結 -->
            <a href="https://teams.live.com/l/invite/FEAQ495qcf0JrSf4g?v=g1" id="btn-meet" target="_blank" class="menu-btn">
                <span>💻</span>Teams上課
            </a>
        </div>

        <!-- 底部可愛柴犬裝飾區塊 -->
        <div class="footer-art">
            <div class="cute-shiba">
                🐾 🐕 🐾
            </div>
        </div>
    </div>

    <!-- 自訂彈跳視窗 -->
    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title">📅 本月上課時間</div>
            <div id="modal-text" class="modal-text">載入中...</div>
            <button class="modal-btn" onclick="closeModal()">確定</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAWlvG0fo23ZKtjjU9rj7RUVKWHB9y2-NoSW4-g0BA13vWOXC3Z7_JzfTAqjIP2_g/exec";
        
        let studentSchedule = "";

        // 1. 本地快取秒開
        const cachedName = localStorage.getItem('student_name');
        const cachedSchedule = localStorage.getItem('student_schedule');
        const cachedLineId = localStorage.getItem('student_line_id');

        if (cachedName) {
            document.getElementById('status').innerText = `✨ 歡迎回來，${cachedName}！`;
        }
        if (cachedSchedule) {
            studentSchedule = cachedSchedule;
        }

        if (cachedLineId) {
            fetchDataInBackground(cachedLineId, cachedName || "學生");
        }

        async function main() {
            try {
                await liff.init({ liffId: "2010817935-88LjVidu" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const lineId = profile.userId;
                
                localStorage.setItem('student_line_id', lineId);

                if (!cachedLineId) {
                    fetchDataInBackground(lineId, profile.displayName);
                }

            } catch (error) {
                if (!cachedName) {
                    document.getElementById('status').innerText = `✨ 歡迎回來！`;
                }
                console.error('Error:', error);
            }
        }

        async function fetchDataInBackground(lineId, displayName) {
            try {
                const response = await fetch(`${SCRIPT_URL}?lineId=${lineId}&name=${encodeURIComponent(displayName)}`);
                const data = await response.json();

                if (data.name) {
                    document.getElementById('status').innerText = `✨ 歡迎回來，${data.name}！`;
                    localStorage.setItem('student_name', data.name);
                }

                if (data.scheduleUrl) {
                    studentSchedule = data.scheduleUrl;
                    localStorage.setItem('student_schedule', data.scheduleUrl);
                }
            } catch (e) {
                console.error('Background fetch error:', e);
            }
        }

        function showSchedule(event) {
            event.preventDefault();
            if (studentSchedule) {
                document.getElementById('modal-text').innerText = studentSchedule;
                document.getElementById('custom-modal').style.display = 'flex';
            } else {
                document.getElementById('modal-text').innerText = '目前尚未設定您的本月上課時間，請聯繫老師唷！';
                document.getElementById('custom-modal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        main();
    </script>
</body>
</html>
