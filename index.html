<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヤス日本語 - 學生學習空間</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfcf0;
            color: #5c5043;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(168, 143, 117, 0.15);
            position: relative;
            z-index: 10;
        }
        h2 {
            color: #b89c7a;
            margin-bottom: 5px;
            font-size: 1.6em;
        }
        #status {
            color: #8c7863;
            font-size: 15px;
            margin: 20px 0;
            font-weight: 500;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .menu-btn {
            background: #fffaf0;
            border: 2px solid #e8e0c9;
            padding: 20px 15px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            color: #786c5e;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(219, 206, 182, 0.3);
        }
        .menu-btn:active {
            background: #e8e0c9;
            transform: translateY(2px);
            box-shadow: none;
        }
        .menu-btn span {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .footer-art {
            margin-top: auto;
            padding-bottom: 20px;
            opacity: 0.7;
        }
        .cute-doodle {
            font-size: 40px;
            letter-spacing: 15px;
            color: #d6cbbd;
        }
        .user-id {
            color: #ccc;
            font-size: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌸 ヤス日本語 🌸</h2>
        <p id="status">正在載入您的專屬資料...</p>

        <!-- 功能按鈕選單 -->
        <div class="menu-grid">
            <a href="#" id="btn-schedule" target="_blank" class="menu-btn" onclick="checkLink(event)">
                <span>📅</span>我的課表
            </a>
            <a href="#" id="btn-drive" target="_blank" class="menu-btn" onclick="checkLink(event)">
                <span>📚</span>課程教材
            </a>
            <a href="https://forms.gle/你的作業表單" target="_blank" class="menu-btn">
                <span>📝</span>上傳作業
            </a>
            <a href="https://line.me/ti/p/你的LINEID" target="_blank" class="menu-btn">
                <span>💬</span>聯絡老師
            </a>
        </div>
        <p class="user-id" id="user-id"></p>
    </div>

    <div class="footer-art">
        <div class="cute-doodle">
            ☕ 📚 🌸
        </div>
    </div>

    <script>
        // Google Apps Script 網頁應用程式網址
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAWlvG0fo23ZKtjjU9rj7RUVKWHB9y2-NoSW4-g0BA13vWOXC3Z7_JzfTAqjIP2_g/exec";

        async function main() {
            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: "2010817935-88LjVidu" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 2. 取得 LINE 個人資料
                const profile = await liff.getProfile();
                const lineId = profile.userId;
                document.getElementById('user-id').innerText = `ID: ${lineId}`;

                // 3. 向 Google Sheet 發送請求，順便帶上 LINE 名字以便自動註冊
                const response = await fetch(`${SCRIPT_URL}?lineId=${lineId}&name=${encodeURIComponent(profile.displayName)}`);
                const data = await response.json();

                // 4. 根據 Google Sheet 回傳的結果更新畫面
                document.getElementById('status').innerText = `🌸 歡迎回來，${data.name}！`;

                // 動態設定按鈕的專屬網址
                if (data.driveUrl) {
                    document.getElementById('btn-drive').href = data.driveUrl;
                }
                if (data.scheduleUrl) {
                    document.getElementById('btn-schedule').href = data.scheduleUrl;
                }

            } catch (error) {
                document.getElementById('status').innerText = '載入資料發生錯誤';
                console.error('Error:', error);
            }
        }

        // 防呆：如果試算表沒填網址就點擊時的提示
        function checkLink(event) {
            const url = event.currentTarget.getAttribute('href');
            if (!url || url === "#") {
                event.preventDefault();
                alert('目前尚未設定您的專屬連結，請聯繫老師唷！');
            }
        }

        main();
    </script>
</body>
</html>
