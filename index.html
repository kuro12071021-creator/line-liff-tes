<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイコーナー - 學生學習空間</title>
    <!-- 引入日系文青圓體 Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Zen Maru Gothic', sans-serif !important;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: #2d3748;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 35px 25px 25px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(44, 76, 126, 0.12);
            margin: auto;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        h2 {
            color: #2b5c8f;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 2.5px;
        }
        
        /* 歡迎狀態卡片 */
        .welcome-card {
            background: #f4f8fb;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 14px 15px;
            margin: 15px 0 25px 0;
        }
        #status {
            color: #3b6e9c;
            font-size: 15px;
            margin: 0;
            font-weight: 700;
        }
        .user-id {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 6px;
            margin-bottom: 0;
            letter-spacing: 0.5px;
        }

        /* 功能按鈕網格 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .menu-btn {
            background: linear-gradient(145deg, #ffffff, #f7fafc);
            border: 2px solid #cbd5e1;
            padding: 24px 10px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.15);
        }
        .menu-btn:hover {
            border-color: #3b82f6;
            color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.2);
        }
        .menu-btn:active {
            background: #e2e8f0;
            transform: translateY(1px);
            box-shadow: none;
        }
        .menu-btn span {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        /* Teams 按鈕專屬微調亮點 */
        #btn-meet {
            border-color: #93c5fd;
            background: linear-gradient(145deg, #f0f7ff, #e0f2fe);
            color: #1e40af;
        }

        /* 底部裝飾 */
        .footer-art {
            margin-top: 25px;
            opacity: 0.85;
        }
        .cute-whale {
            font-size: 24px;
            letter-spacing: 6px;
        }

        /* 自訂美觀彈跳視窗 */
        #custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 24px;
            width: 88%;
            max-width: 330px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: #2b5c8f;
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .modal-text {
            color: #334155;
            font-size: 15px;
            white-space: pre-line;
            line-height: 1.7;
            margin-bottom: 22px;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 14px;
        }
        .modal-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 11px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
            transition: all 0.2s;
        }
        .modal-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💙 マイコーナー 💙</h2>
        
        <!-- 歡迎狀態專屬卡片 -->
        <div class="welcome-card">
            <p id="status">正在載入您的專屬空間...</p>
            <p class="user-id" id="user-id"></p>
        </div>

        <!-- 2大核心功能按鈕 -->
        <div class="menu-grid">
            <a href="#" id="btn-schedule" class="menu-btn" onclick="showSchedule(event)">
                <span>📅</span>課程時間
            </a>
            <!-- 固定的 Teams 上課連結 -->
            <a href="https://teams.live.com/l/invite/FEAQ495qcf0JrSf4g?v=g1" id="btn-meet" target="_blank" class="menu-btn">
                <span>💻</span>Teams上課
            </a>
        </div>

        <!-- 底部藍色系清爽裝飾 -->
        <div class="footer-art">
            <div class="cute-whale">
                🐳 💧 🐳
            </div>
        </div>
    </div>

    <!-- 自訂彈跳視窗 -->
    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title">📅 本月上課時間</div>
            <div id="modal-text" class="modal-text">載入中...</div>
            <button class="modal-btn" onclick="closeModal()">確定</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAWlvG0fo23ZKtjjU9rj7RUVKWHB9y2-NoSW4-g0BA13vWOXC3Z7_JzfTAqjIP2_g/exec";
        
        let studentSchedule = "";

        async function main() {
            try {
                await liff.init({ liffId: "2010817935-88LjVidu" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const lineId = profile.userId;
                document.getElementById('user-id').innerText = `ID: ${lineId}`;

                // 透過 Google Apps Script 從試算表抓取該學生的專屬名字與課表
                const response = await fetch(`${SCRIPT_URL}?lineId=${lineId}&name=${encodeURIComponent(profile.displayName)}`);
                const data = await response.json();

                document.getElementById('status').innerText = `✨ 歡迎回來，${data.name}！`;

                if (data.scheduleUrl) {
                    studentSchedule = data.scheduleUrl;
                }

            } catch (error) {
                document.getElementById('status').innerText = '✨ 歡迎來到學生學習空間';
                console.error('Error:', error);
            }
        }

        // 點擊「課程時間」時顯示專屬彈窗
        function showSchedule(event) {
            event.preventDefault();
            if (studentSchedule) {
                document.getElementById('modal-text').innerText = studentSchedule;
                document.getElementById('custom-modal').style.display = 'flex';
            } else {
                document.getElementById('modal-text').innerText = '目前尚未設定您的本月上課時間，請聯繫老師唷！';
                document.getElementById('custom-modal').style.display = 'flex';
            }
        }

        // 關閉彈窗
        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        main();
    </script>
</body>
</html>
